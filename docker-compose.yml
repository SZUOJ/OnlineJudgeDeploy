version: '3'
services:

    # 判题机
    oj-judger:
        image: aelitadoc/szuoj-judger-server
        container_name: oj-judger
        restart: always
        read_only: true
        cap_drop:
            - SETPCAP
            - MKNOD
            - NET_BIND_SERVICE
            - SYS_CHROOT
            - SETFCAP
            - FSETID
        tmpfs:
            - /tmp
        volumes:
            - ./data/backend/test_case:/test_case:ro
            - ./data/judge_server/log:/log
            - ./data/judge_server/run:/judger
        environment:
            - SERVICE_URL=http://oj-judger:8080
            - BACKEND_URL=http://oj-backend:8000/api/judge_server_heartbeat/
            - LANG=C.UTF-8
            - TOKEN=${JUDGE_SERVER_TOKEN}
            # - judger_debug=1

    # 数据库，postgresql
    oj-postgres:
        image: library/postgres:12-alpine
        container_name: oj-postgres
        restart: always
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
            - ./conf/postgresql.conf:/var/lib/postgresql/data/postgresql.conf:ro  # 挂载自定义配置文件（只读）
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}

    oj-pgbouncer:
        image: pgbouncer/pgbouncer:1.14.0

    # 缓存
    oj-redis:
        image: library/redis:6-alpine
        container_name: oj-redis
        restart: always
        volumes:
            - ./data/redis:/data

    # 消息队列
    oj-mq:
        image: library/rabbitmq:3-alpine
        container_name: oj-mq
        restart: always
        volumes:
            - ./data/rabbitmq:/var/lib/rabbitmq
        environment:
            - RABBITMQ_DEFAULT_USER=${MQ_USER}
            - RABBITMQ_DEFAULT_PASS=${MQ_PASS}

    # 后端
    oj-backend:
        image: aelitadoc/szuoj-be
        container_name: oj-backend
        restart: always
        volumes:
            - ./data/backend:/app/data
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            - PROJ_ENV

            - DB_HOST
            - DB_NAME
            - DB_USER
            - DB_PASSWORD

            - REDIS_HOST
            - REDIS_PORT

            - MQ_HOST
            - MQ_USER
            - MQ_PASS

            - ROOT_USERNAME
            - ROOT_PASSWORD

            - JUDGER_SERVER_URL
            - JUDGE_SERVER_TOKEN
        depends_on:
            - oj-postgres
            - oj-redis
            - oj-mq
            - oj-judger
