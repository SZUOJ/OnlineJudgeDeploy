# OJ的Nginx配置文件

server {
    # 设置用户名，文件IO将在/home/用户目录/SZUOJ/OnlineJudgeDeploy下进行
    set $user ;

	listen 80;
	listen [::]:80;

	server_name _;

	location /api {
		proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
	}

	location /app/data/media {
        alias /home/$user/SZUOJ/OnlineJudgeDeploy/data/backend/media;
    }

	location /admin {
		root /home/$user/SZUOJ/OnlineJudgeDeploy/dist/admin;
		try_files $uri $uri/ /index.html =404;
	}

	location / {
		root /home/$user/SZUOJ/OnlineJudgeDeploy/dist;
		try_files $uri $uri/ /index.html =404;
	}
}
