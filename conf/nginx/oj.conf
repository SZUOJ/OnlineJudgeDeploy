# OJ的Nginx配置文件

upstream BACKEND {
    server oj-backend:8000;
    keepalive 1000;
}


server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    server_tokens  off; # 去除 nginx 版本
    fastcgi_hide_header X-Powered-By; # 去除 Nginx 的 X-Powered-By header

    include url.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    include ssl.conf;
    include url.conf;
}
