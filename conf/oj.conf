# OJ的Nginx配置文件

gzip_min_length 1k;      # 设置允许压缩的页面最小字节(从header头的Content-Length中获取) ，当返回内容大于此值时才会使用gzip进行压缩,以K为单位,当值为0时，所有页面都进行压缩。建议大于1k
gzip_buffers 16 8k;      # 设置gzip申请内存的大小,其作用是按块大小的倍数申请内存空间,param2:int(k) 后面单位是k。这里设置以16k为单位,按照原始数据大小以16k为单位的4倍申请内存
gzip_http_version 1.1;   # 识别http协议的版本,早起浏览器可能不支持gzip自解压,用户会看到乱码
gzip_comp_level 2;       # 设置gzip压缩等级，等级越底压缩速度越快文件压缩比越小，反之速度越慢文件压缩比越大；等级1-9，最小的压缩最快 但是消耗cpu
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;    # 设置需要压缩的MIME类型,非设置值不进行压缩，即匹配压缩类型
gzip_vary on;            # 启用应答头"Vary: Accept-Encoding"

server {
    # 设置用户名，文件IO将在/home/用户目录/SZUOJ/OnlineJudgeDeploy下进行
    set $user ;

	listen 80;
	listen [::]:80;

	server_name _;

	location /api {
		proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
	}

	location /data/media {
        alias /home/$user/SZUOJ/OnlineJudgeDeploy/data/backend/media;
    }

	location /admin {
		root /home/$user/SZUOJ/OnlineJudgeDeploy/dist/admin;
		try_files $uri $uri/ /index.html =404;
	}

	location / {
		root /home/$user/SZUOJ/OnlineJudgeDeploy/dist;
		try_files $uri $uri/ /index.html =404;
	}
}
