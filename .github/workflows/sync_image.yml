name: Sync Image

on:
  schedule:
    # 每天 UTC 时间 0 点 0 分 0 秒执行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: hhyasdf/image-sync-action@v1.1
        with:
          auth_file: ./.github/workflows/conf/image_syncer/auth.yml
          images_file: ./.github/workflows/conf/image_syncer/images.yml
          version: latest # The version of image-syncer, use the latest version if not specified.
          proc: 16 # The max number of goroutines to sync images, default value is 5.
        env:
          ALI_USERNAME: ${{ secrets.ALI_USERNAME }}
          ALI_PASSWORD: ${{ secrets.ALI_PASSWORD }}