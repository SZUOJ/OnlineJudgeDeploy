# 预发布环境

services:

  # 数据库，postgresql
  oj-postgres:
    image: library/postgres:12-alpine
    container_name: oj-postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    # - ./conf/postgresql.conf:/var/lib/postgresql/data/postgresql.conf:ro  # 挂载自定义配置文件（只读）
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  # 数据库连接池
  oj-pgbouncer:
    image: bitnamilegacy/pgbouncer:1.21.0
    container_name: oj-pgbouncer
    restart: always
    # 不继承宿主机的 DNS search 域，避免旧版 c-ares 无法解析 Compose 服务名。
    dns_search: .
    depends_on:
      oj-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "PGCONNECT_TIMEOUT=3 PGPASSWORD=\"$${POSTGRESQL_PASSWORD}\" psql -w -h 127.0.0.1 -p \"$${PGBOUNCER_PORT}\" -U \"$${POSTGRESQL_USERNAME}\" -d \"$${POSTGRESQL_DATABASE}\" -v ON_ERROR_STOP=1 -tAc 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      - PGBOUNCER_PORT=${PG_BOUNCER_PORT}
      - PGBOUNCER_MAX_CLIENT_CONN=1000
      - PGBOUNCER_DATABASE=${DB_NAME}
      - PGBOUNCER_AUTH_TYPE=md5

      - POSTGRESQL_HOST=${DB_HOST}
      - POSTGRESQL_PORT=${DB_PORT}
      - POSTGRESQL_DATABASE=${DB_NAME}
      - POSTGRESQL_USERNAME=${DB_USER}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD}

  # 缓存
  oj-redis:
    image: library/redis:7-alpine
    container_name: oj-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: always
    volumes:
      - rdb_data:/data

  # 后端
  oj-backend:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/backend:master
    container_name: oj-backend
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8000/api/info/ready/" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5m
    restart: always
    volumes:
      - test_case_data:/app/data/test_case
      - media_data:/app/data/media
      - judge_agent_credentials:/app/data/judge_agent_credentials
      - ./data/backend/log:/app/data/log
      - ./data/backend/config:/app/data/config
    environment:
      - PROJ_ENV

      - DB_HOST=oj-pgbouncer
      - DB_PORT=${PG_BOUNCER_PORT}
      - DB_NAME
      - DB_USER
      - DB_PASSWORD

      - REDIS_HOST
      - REDIS_PORT

      - ROOT_USERNAME
      - ROOT_PASSWORD

      - JUDGE_AGENT_HEARTBEAT_INTERVAL
      - JUDGE_AGENT_LEASE_SECONDS
      - JUDGE_AGENT_OFFLINE_SECONDS
      - JUDGE_AGENT_MAX_RETRIES
      - JUDGE_AGENT_TASK_POLL_INTERVAL
      - JUDGE_AGENT_LOCAL_CREDENTIALS_DIR=/app/data/judge_agent_credentials
    depends_on:
      oj-postgres:
        condition: service_healthy
      oj-redis:
        condition: service_healthy
      oj-pgbouncer:
        condition: service_healthy

  # 默认单机 JudgeAgent。后端在健康前将节点凭据原子写入共享卷。
  judge-agent:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/judge_agent:main
    init: true
    container_name: oj-judge-agent
    restart: always
    pids_limit: ${JUDGE_AGENT_PIDS_LIMIT:-512}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp:exec,mode=1777,size=${JUDGE_AGENT_TMPFS_SIZE:-512m}
    volumes:
      - judge_cache:/test_case
      - judge_agent_credentials:/run/judge-agent-credentials:ro
      - ./data/judge_agent/log:/log
      - ./data/judge_agent/run:/judger
      - ./conf/judge-agent.local.yaml:/etc/judge-agent/config.yaml:ro
    environment:
      - LANG=C.UTF-8
      - JUDGE_AGENT_CONFIG=/etc/judge-agent/config.yaml
      - JUDGE_AGENT_WS_URL=ws://oj-backend:8000/ws/judge/
      - JUDGE_AGENT_FILE_URL=http://oj-backend:8000/api/judge-agent/files/
      - JUDGE_AGENT_NODE_ID_FILE=/run/judge-agent-credentials/node-id
      - JUDGE_AGENT_TOKEN_FILE=/run/judge-agent-credentials/node-token
      - JUDGE_AGENT_CREDENTIAL_WAIT_SECONDS=${JUDGE_AGENT_CREDENTIAL_WAIT_SECONDS:-60}
      - JUDGE_AGENT_NAME=${JUDGE_AGENT_NAME:-local-judge-agent}
      - JUDGE_AGENT_CONCURRENCY=${JUDGE_NODE_CONCURRENCY:-6}
      - JUDGE_AGENT_LANGUAGES=${JUDGE_AGENT_LANGUAGES:-c,cpp,java,py,go,js}
      - JUDGE_AGENT_MIN_PRIORITY=${JUDGE_AGENT_MIN_PRIORITY:-0}
      - JUDGE_AGENT_CACHE_DIR=/test_case
      - JUDGE_AGENT_CACHE_DAYS=${JUDGE_AGENT_CACHE_DAYS:-30}
      - JUDGE_AGENT_TLS_VERIFY=false
      - JUDGE_TEST_CASE_WORKERS=1
    depends_on:
      oj-backend:
        condition: service_healthy

  # 后端 celery beat 进程
  oj-backend-celery-beat:
    # extends 关键字 继承后端的配置
    extends:
      service: oj-backend
    container_name: oj-backend-celery-beat
    healthcheck:
      disable: true
    environment:
      - PROGRAM=celery_beat
    volumes:
      - judge_agent_credentials:/app/data/judge_agent_credentials:ro
    entrypoint: [ "/bin/sh", "-c", "celery -A OnlineJudge beat -l info -f /app/data/log/celery_beat.log" ]
    depends_on:
      oj-backend:
        condition: service_healthy

  # 后端 celery worker 进程
  oj-backend-celery-worker:
    # extends 关键字 继承后端的配置
    extends:
      service: oj-backend
    container_name: oj-backend-celery-worker
    healthcheck:
      disable: true
    environment:
      - PROGRAM=celery_worker
    volumes:
      - judge_agent_credentials:/app/data/judge_agent_credentials:ro
    entrypoint: [ "/bin/sh", "-c", "celery -A OnlineJudge worker -l info -f /app/data/log/celery_worker.log" ]
    depends_on:
      oj-backend:
        condition: service_healthy

  # Nginx + 前端
  oj-frontend:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/frontend:master
    container_name: oj-frontend
    restart: always
    depends_on:
      oj-backend:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - media_data:/app/data/media:ro
      - ./conf/nginx/oj.conf:/etc/nginx/conf.d/oj.conf:ro
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./conf/nginx/url.conf:/etc/nginx/url.conf:ro
      - ./conf/ssl:/app/ssl:ro
      # - ./data/nginx/log:/var/log/nginx  # Nginx日志映射至宿主机

  portainer:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/portainer:alpine
    container_name: portainer
    restart: always
    ports:
      - '9000:9000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # 代码规范检查服务器
  # 可选组件，需要在系统设置中开启才能使用；如果不需要启动该组件，可将其注释
  oj-lint-server:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/lint-server:latest
    container_name: oj-lint-server
    restart: always
    volumes:
      - ./data/lint_server/log:/app/log

volumes:
  pg_data:
  rdb_data:
  media_data:
  test_case_data:
  portainer_data:
  judge_cache:
  judge_agent_credentials:
