# 预发布环境

version: '3'
services:

  # 数据库，postgresql
  oj-postgres:
    image: library/postgres:12-alpine
    container_name: oj-postgres
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    # - ./conf/postgresql.conf:/var/lib/postgresql/data/postgresql.conf:ro  # 挂载自定义配置文件（只读）
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  # 数据库连接池
  oj-pgbouncer:
    image: pgbouncer/pgbouncer:1.15.0
    container_name: oj-pgbouncer
    restart: always
    depends_on:
      - oj-postgres
    environment:
      - PGBOUNCER_LISTEN_PORT=${PG_BOUNCER_PORT}

      - DATABASES_HOST=${DB_HOST}
      - DATABASES_PORT=${DB_PORT}
      - DATABASES_DBNAME=${DB_NAME}
      - DATABASES_USER=${DB_USER}
      - DATABASES_PASSWORD=${DB_PASSWORD}

      - DATABASES_POOL_MODE=session
      - DATABASES_POOL_SIZE=50
      - DATABASES_RESERVE_POOL=50
      - PGBOUNCER_MAX_CLIENT_CONN=1000

  # 缓存
  oj-redis:
    image: library/redis:6-alpine
    container_name: oj-redis
    restart: always
    volumes:
      - rdb_data:/data

  # 后端
  oj-backend:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/backend:master
    container_name: oj-backend
    healthcheck:
      test: "curl --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://127.0.0.1:8000/api/info/ping/"
      interval: 5s
      timeout: 1s
      retries: 3
    restart: always
    volumes:
      - test_case_data:/app/data/test_case
      - media_data:/app/data/media
      - ./data/backend/log:/app/data/log
      - ./data/backend/config:/app/data/config
    environment:
      - PROJ_ENV

      - DB_HOST=oj-pgbouncer
      - DB_PORT=${PG_BOUNCER_PORT}
      - DB_NAME
      - DB_USER
      - DB_PASSWORD

      - REDIS_HOST
      - REDIS_PORT

      - ROOT_USERNAME
      - ROOT_PASSWORD

      - JUDGER_SERVER_URL
      - JUDGE_SERVER_TOKEN
    depends_on:
      oj-postgres:
        condition: service_healthy
      oj-redis:
        condition: service_healthy
      oj-pgbouncer:
        condition: service_started

  # 后端 celery beat 进程
  oj-backend-celery-beat:
    # extends 关键字 继承后端的配置
    extends:
      service: oj-backend
    container_name: oj-backend-celery-beat
    healthcheck:
      disable: true
    environment:
      - PROGRAM=celery_beat
    entrypoint: [ "/bin/sh", "-c", "celery -A OnlineJudge beat -l info -f /app/data/log/celery_beat.log" ]

  # 后端 celery worker 进程
  oj-backend-celery-worker:
    # extends 关键字 继承后端的配置
    extends:
      service: oj-backend
    container_name: oj-backend-celery-worker
    healthcheck:
      disable: true
    environment:
      - PROGRAM=celery_worker
    entrypoint: [ "/bin/sh", "-c", "celery -A OnlineJudge worker -l info -f /app/data/log/celery_worker.log" ]

  # Nginx + 前端
  oj-frontend:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/frontend:master
    container_name: oj-frontend
    restart: always
    depends_on:
      - oj-backend
    ports:
      - '80:80'
    volumes:
      - media_data:/app/data/media:ro
      - ./conf/nginx/oj.conf:/etc/nginx/conf.d/oj.conf:ro
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./conf/nginx/url.conf:/etc/nginx/url.conf:ro
      - ./conf/ssl:/app/ssl:ro
      # - ./data/nginx/log:/var/log/nginx  # Nginx日志映射至宿主机

  # 判题机
  oj-judger:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/judge_server:master
    container_name: oj-judger
    restart: always
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    volumes:
      - test_case_data:/test_case:ro
      - ./data/judge_server/log:/log
      - ./data/judge_server/run:/judger
    environment:
      - SERVICE_URL=http://oj-judger:8080
      - BACKEND_URL=http://oj-backend:8000/api/manage/sys/judge_server/heartbeat/
      - LANG=C.UTF-8
      - TOKEN=${JUDGE_SERVER_TOKEN}
      # - judger_debug=1
    depends_on:
      - oj-backend

  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    restart: always
    ports:
      - '9000:9000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # 代码规范检查服务器
  # 可选组件，需要在系统设置中开启才能使用；如果不需要启动该组件，可将其注释
  oj-lint-server:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/lint-server:latest
    container_name: oj-lint-server
    restart: always
    volumes:
      - ./data/lint_server/log:/app/log

volumes:
  pg_data:
  rdb_data:
  media_data:
  test_case_data:
  portainer_data:
