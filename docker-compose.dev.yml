version: '3'
services:

    # 判题机
    oj-judger:
        ports:
            - "12358:8080"

    # 数据库，postgresql
    oj-postgres:
        ports:
            - "5432:5432"

    # 消息队列
    oj-mq:
        ports:
            - "5672:5672"

    # redis
    oj-redis:
        ports:
            - "6379:6379"

    # 后端
    oj-backend:
        volumes:
            - ../OnlineJudge:/app  # 开发用
        environment:
            - PROJ_ENV=DEV