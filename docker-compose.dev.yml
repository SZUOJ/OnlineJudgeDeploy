services:

  # 本地一体化 JudgeAgent，负责连接、缓存、编译和沙箱执行。
  judge-agent:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/judge_agent:develop
    build:
      context: ../JudgeAgent
    container_name: oj-judge-agent-dev
    restart: unless-stopped
    pids_limit: ${JUDGE_AGENT_PIDS_LIMIT:-512}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp:exec,mode=1777,size=${JUDGE_AGENT_TMPFS_SIZE:-512m}
    volumes:
      - judge_cache_dev:/test_case
      - ./data/judge_agent/log:/log
      - ./data/judge_agent/run:/judger
      - ./conf/judge-agent.dev.yaml:/etc/judge-agent/config.yaml:ro
    environment:
      - JUDGE_AGENT_CONFIG=/etc/judge-agent/config.yaml
      - JUDGE_AGENT_WS_URL=ws://oj-backend:8000/ws/judge/
      - JUDGE_AGENT_FILE_URL=http://oj-backend:8000/api/judge-agent/files/
      - JUDGE_AGENT_NODE_ID
      - JUDGE_AGENT_NAME=${JUDGE_AGENT_NAME:-local-dev-node}
      - JUDGE_AGENT_CONCURRENCY=${JUDGE_NODE_CONCURRENCY:-2}
      - JUDGE_AGENT_LANGUAGES=${JUDGE_AGENT_LANGUAGES:-c,cpp,java,py,go,js}
      - JUDGE_AGENT_MIN_PRIORITY=${JUDGE_AGENT_MIN_PRIORITY:-0}
      - JUDGE_AGENT_TOKEN_FILE=/run/secrets/judge_agent_token
      - JUDGE_AGENT_CACHE_DIR=/test_case
      - JUDGE_AGENT_TLS_VERIFY=false
      - JUDGE_TEST_CASE_WORKERS=1
    secrets:
      - judge_agent_token
    depends_on:
      oj-backend:
        condition: service_healthy

  # 数据库，postgresql
  oj-postgres:
    container_name: oj-postgres-dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  # redis
  oj-redis:
    container_name: oj-redis-dev
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 数据库连接池
  oj-pgbouncer:
    container_name: oj-pgbouncer-dev
    healthcheck:
      test: [ "CMD-SHELL", "PGCONNECT_TIMEOUT=3 PGPASSWORD=\"$${POSTGRESQL_PASSWORD}\" psql -w -h 127.0.0.1 -p \"$${PGBOUNCER_PORT}\" -U \"$${POSTGRESQL_USERNAME}\" -d \"$${POSTGRESQL_DATABASE}\" -v ON_ERROR_STOP=1 -tAc 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      oj-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:6432"

  # 后端
  oj-backend:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/backend:develop
    container_name: oj-backend-dev
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8000/api/info/ready/" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5m
    volumes:
      - ../OnlineJudge:/app  # 开发用
      - backend_static:/app/data/static
    environment:
      - PROJ_ENV=DEV
    depends_on:
      oj-postgres:
        condition: service_healthy
      oj-redis:
        condition: service_healthy
      oj-pgbouncer:
        condition: service_healthy
  #    - DEV_SERVER_HOST=  # 配置开发服务器IP

  oj-backend-celery-beat:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/backend:develop
    container_name: oj-backend-celery-beat-dev
    volumes:
      - ../OnlineJudge:/app  # 开发用
    depends_on:
      oj-backend:
        condition: service_healthy

  # 后端 celery worker 进程
  oj-backend-celery-worker:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/backend:develop
    container_name: oj-backend-celery-worker-dev
    volumes:
      - ../OnlineJudge:/app  # 开发用
    depends_on:
      oj-backend:
        condition: service_healthy

  oj-frontend:
    container_name: oj-frontend-dev
    depends_on:
      oj-backend:
        condition: service_healthy
    volumes:
      - backend_static:/app/backend_static
      - ../OnlineJudgeFE/dist/:/app/dist/

volumes:
  backend_static:
  judge_cache_dev:

secrets:
  judge_agent_token:
    file: ./conf/judge-agent.token
