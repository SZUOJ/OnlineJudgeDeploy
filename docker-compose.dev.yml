version: '3'
services:

    # 判题机
    oj-judger:
        ports:
            - "0.0.0.0:12358:8080"

    # 数据库，postgresql
    oj-postgres:
        ports:
            - "127.0.0.1:5432:5432"

    # 后端
    oj-backend:
        volumes:
            - ../OnlineJudge:/app  # 开发用
        ports:
            - "8000:8000"
        environment:
            - PROJ_ENV=DEV              # 开发环境
