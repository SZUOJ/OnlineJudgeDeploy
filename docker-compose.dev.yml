version: '3'
services:

  # 判题机
  oj-judger:
    image: szuoj/judge_server:develop
    ports:
      - "12358:8080"

  # 数据库，postgresql
  oj-postgres:
    ports:
      - "5432:5432"

  # 消息队列
  oj-mq:
    ports:
      - "5672:5672"

  # redis
  oj-redis:
    ports:
      - "6379:6379"

  # 数据库连接池
  oj-pgbouncer:
    ports:
      - "6432:6432"

  # 后端
  oj-backend:
    image: aelitadoc/szuoj-be:develop
    volumes:
      - ../OnlineJudge:/app  # 开发用
      - backend_static:/app/data/static
    environment:
      - PROJ_ENV=DEV

  oj-frontend:
    volumes:
      - backend_static:/app/backend_static

volumes:
  backend_static:
