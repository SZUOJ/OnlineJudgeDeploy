version: '3'
services:

  # 判题机
  oj-judger:
    ports:
      - "12358:8080"

  # 数据库，postgresql
  oj-postgres:
    ports:
      - "5432:5432"

  # 消息队列
  oj-mq:
    ports:
      - "5672:5672"

  # redis
  oj-redis:
    ports:
      - "6379:6379"

  # 数据库连接池
  oj-pgbouncer:
    image: pgbouncer/pgbouncer:1.14.0
    container_name: oj-pgbouncer
    restart: always
    depends_on:
      - oj-postgres
    ports:
      - "6432:6432"
    environment:
      - PGBOUNCER_LISTEN_PORT=${PG_BOUNCER_PORT}

      - DATABASES_HOST=${DB_HOST}
      - DATABASES_PORT=${DB_PORT}
      - DATABASES_DBNAME=${DB_NAME}
      - DATABASES_USER=${DB_USER}
      - DATABASES_PASSWORD=${DB_PASSWORD}

      - DATABASES_POOL_MODE=transaction
      - DATABASES_POOL_SIZE=50
      - DATABASES_RESERVE_POOL=50
      - PGBOUNCER_MAX_CLIENT_CONN=1000

  # 后端
  oj-backend:
    image: aelitadoc/szuoj-be:develop
    volumes:
      - ../OnlineJudge:/app  # 开发用
      - backend_static:/app/data/static
    environment:
      - PROJ_ENV=DEV
      - DB_HOST=oj-pgbouncer
      - DB_PORT=${PG_BOUNCER_PORT}
    depends_on:
      - oj-postgres
      - oj-redis
      - oj-mq
      - oj-judger
      - oj-pgbouncer

  oj-frontend:
    volumes:
      - backend_static:/app/backend_static

volumes:
  backend_static:
