services:
  judge-agent:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/judge_agent:main
    container_name: oj-judge-agent
    restart: always
    pids_limit: ${JUDGE_AGENT_PIDS_LIMIT:-512}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp:exec,mode=1777,size=${JUDGE_AGENT_TMPFS_SIZE:-512m}
    volumes:
      - judge_cache:/test_case
      - ./data/judge_agent/log:/log
      - ./data/judge_agent/run:/judger
      - ./conf/judge-agent.yaml:/etc/judge-agent/config.yaml:ro
    environment:
      - LANG=C.UTF-8
      - JUDGE_AGENT_CONFIG=/etc/judge-agent/config.yaml
      - JUDGE_AGENT_WS_URL
      - JUDGE_AGENT_FILE_URL
      - JUDGE_AGENT_NODE_ID
      - JUDGE_AGENT_NAME
      - JUDGE_AGENT_CONCURRENCY=${JUDGE_NODE_CONCURRENCY:-2}
      - JUDGE_AGENT_LANGUAGES=${JUDGE_AGENT_LANGUAGES:-c,cpp,java,py,go,js}
      - JUDGE_AGENT_MIN_PRIORITY=${JUDGE_AGENT_MIN_PRIORITY:-0}
      - JUDGE_AGENT_TOKEN_FILE=/run/secrets/judge_agent_token
      - JUDGE_AGENT_CACHE_DIR=/test_case
      - JUDGE_AGENT_CACHE_DAYS=${JUDGE_AGENT_CACHE_DAYS:-30}
      - JUDGE_AGENT_TLS_VERIFY=${JUDGE_AGENT_TLS_VERIFY:-true}
      - JUDGE_TEST_CASE_WORKERS=1
    secrets:
      - judge_agent_token

volumes:
  judge_cache:

secrets:
  judge_agent_token:
    file: ./conf/judge-agent.token
