services:
  judge-server:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/judge_server:latest
    container_name: oj-judge-server
    restart: always
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    volumes:
      - judge_cache:/test_case:ro
      - ./data/judge_server/log:/log
      - ./data/judge_server/run:/judger
    environment:
      - LANG=C.UTF-8
      - TOKEN_FILE=/run/secrets/judge_server_token
      - JUDGE_SERVER_WORKERS=${JUDGE_NODE_CONCURRENCY:-2}
      - JUDGE_TEST_CASE_WORKERS=1
      - JUDGE_SERVER_VERSION=${JUDGE_SERVER_VERSION:-latest}
    secrets:
      - judge_server_token

  judge-agent:
    image: registry.cn-shenzhen.aliyuncs.com/szuoj/judge_agent:latest
    container_name: oj-judge-agent
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - judge_cache:/test_case
      - ./conf/judge-agent.yaml:/etc/judge-agent/config.yaml:ro
    environment:
      - JUDGE_AGENT_CONFIG=/etc/judge-agent/config.yaml
      - JUDGE_AGENT_WS_URL
      - JUDGE_AGENT_FILE_URL
      - JUDGE_AGENT_NODE_ID
      - JUDGE_AGENT_NAME
      - JUDGE_AGENT_CONCURRENCY=${JUDGE_NODE_CONCURRENCY:-2}
      - JUDGE_AGENT_LANGUAGES=${JUDGE_AGENT_LANGUAGES:-c,cpp,java,py,go,js}
      - JUDGE_AGENT_MIN_PRIORITY=${JUDGE_AGENT_MIN_PRIORITY:-0}
      - JUDGE_AGENT_TOKEN_FILE=/run/secrets/judge_agent_token
      - JUDGE_SERVER_URL=http://judge-server:8080
      - JUDGE_SERVER_TOKEN_FILE=/run/secrets/judge_server_token
      - JUDGE_AGENT_CACHE_DIR=/test_case
      - JUDGE_AGENT_CACHE_DAYS=${JUDGE_AGENT_CACHE_DAYS:-30}
      - JUDGE_AGENT_TLS_VERIFY=${JUDGE_AGENT_TLS_VERIFY:-true}
    secrets:
      - judge_agent_token
      - judge_server_token
    depends_on:
      judge-server:
        condition: service_healthy

volumes:
  judge_cache:

secrets:
  judge_agent_token:
    file: ./conf/judge-agent.token
  judge_server_token:
    file: ./conf/judge-server.token
